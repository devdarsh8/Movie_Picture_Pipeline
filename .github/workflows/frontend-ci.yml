name: Frontend CI

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        working-directory: ./starter/frontend
        run: npm ci
        
      - name: Run Lint
        working-directory: ./starter/frontend
        run: npm run lint
        
      - name: Run Test
        working-directory: ./starter/frontend
        run: npm test -- --watchAll=false

  build:
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Docker image
        working-directory: ./starter/frontend
        run: docker build -t movie-frontend:${{ github.sha }} .